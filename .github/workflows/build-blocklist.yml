name: Build blocklist.bin

on:
  schedule:
    - cron: "0 3 * * 1"   # 每周一 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build blocklist
        run: |
          python tools/build_blocklist.py blocklist.bin \
            https://raw.githubusercontent.com/217heidai/adblockfilters/main/rules/adblockdomainlite.txt

      - name: Publish to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: blocklist
          name: Blocklist
          files: blocklist.bin
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
